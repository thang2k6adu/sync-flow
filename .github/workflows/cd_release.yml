name: Flutter CD - Release Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_aab:
        description: 'Build Google Play App Bundle (.aab)'
        required: true
        type: boolean
        default: true
      build_apk:
        description: 'Build APK (.apk)'
        required: true
        type: boolean
        default: true

jobs:
  release:
    name: Build & Release Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📄 Prepare environment file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔨 Build Android Release APK
        if: ${{ github.event_name == 'push' || inputs.build_apk == true }}
        run: flutter build apk --release

      - name: 🔨 Build Android App Bundle (.aab)
        if: ${{ github.event_name == 'push' || inputs.build_aab == true }}
        run: flutter build appbundle --release

      - name: 📤 Upload Artifacts (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-binaries
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
