# ============================
# 🔧 GRADLE BUILD PERFORMANCE
# ============================

org.gradle.jvmargs=-Xmx4096M -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

# ✅ Bật chế độ song song
org.gradle.parallel=true

# ✅ Bật build daemon để giữ Gradle nóng giữa các lần build
org.gradle.daemon=true
org.gradle.daemon.idletimeout=600000

# ✅ Bật build caching (rất quan trọng)
org.gradle.caching=true

# ✅ Giảm log khi build
org.gradle.warning.mode=summary

# ============================
# ⚡ ANDROID SETTINGS
# ============================

# ✅ Bật chế độ build nhanh hơn cho các module Flutter plugin
android.useAndroidX=true
android.enableJetifier=true

# ✅ Giúp build nhanh hơn với AGP 8+
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# ✅ Nếu đang dùng chip Apple Silicon (M1/M2/M3)
# Chặn lỗi "could not reserve enough space for object heap"
# org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home

# ============================
# 🚀 FLUTTER SETTINGS
# ============================

# Tăng tốc độ Gradle plugin của Flutter
flutter.fastBuild=true


# ============================
# 🧠 OPTIONAL (an toàn cho plugin Firebase / Google)
# ============================

# Cho phép Gradle chạy song song nhưng vẫn an toàn với Google Services plugin
org.gradle.configureondemand=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false

# Giới hạn RAM cho Kotlin daemon
kotlin.daemon.jvmargs=-Xmx768M
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
